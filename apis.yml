name: Pi Health
description: >-
  Pi Health is an AI-native clinical trial technology company and contract
  research organization (CRO) building FICS, a unified operating system for
  oncology and global clinical trials. Its platform consolidates traditionally
  fragmented systems — Electronic Data Capture (EDC), Clinical Trial Management
  System (CTMS), electronic Trial Master File (eTMF), electronic Investigator
  Site File (eISF), and an EMR-to-EDC Orchestrator — into a single AI-validated
  master record spanning study startup through closeout. Pi Health pairs the
  platform with CRO services and a global research network with oncology sites
  across the US, Brazil, Australia, and India. As of this profile the company
  exposes no public developer API, SDK, or documentation surface; this remains
  an identity profile in the API Evangelist network awaiting a public API.
